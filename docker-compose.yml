services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-makerspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-makerspace}
      POSTGRES_DB: ${POSTGRES_DB:-makerspace_xp}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-makerspace}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-makerspace}:${POSTGRES_PASSWORD:-makerspace}@db:5432/${POSTGRES_DB:-makerspace_xp}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  db_data:
